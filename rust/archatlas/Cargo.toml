[package]
name = "archatlas"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
description = "Deterministic Structural Memory for Repository-Scale LLM Agents (Rust CLI)"
publish = false

[dependencies]
# Armazenamento e busca lexical: candidato congelado em plans/RUST_CLI_PILOTO_REAL.md §3.
# `bundled` compila o SQLite com FTS5 a partir da fonte (exige cc; presente na maquina).
rusqlite = { version = "0.32", features = ["bundled"] }
# Serializacao deterministica do envelope: structs preservam a ordem de declaracao dos campos.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hash de conteudo e do trecho entregue.
sha2 = "0.10"
# Descoberta que respeita .gitignore/hidden, igual ao walker do ripgrep.
ignore = "0.4"
# Leitura+hash em paralelo; escrita permanece serial (um escritor por indice).
rayon = "1"
# Diagnostico em stderr sem panic.
anyhow = "1"

[profile.release]
# Perfil inicial; variantes (LTO thin etc.) sao ablasao medida em R2, nao escolha presumida.
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "archatlas"
path = "src/main.rs"
